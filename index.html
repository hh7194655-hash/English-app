<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#18233b"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png">
<title>英语成长</title>
<style>
:root{--ink:#18233b;--sky:#eef2f6;--card:#fff;--teal:#1f8a7d;--mute:#5d6b82;--no:#b4533c;--line:#d5dce6;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--ink:#eef2f6;--sky:#18233b;--card:#222f4d;--teal:#59c2b4;--mute:#a7b3c6;--no:#e59a84;--line:#34436a}}
*{box-sizing:border-box}body{margin:0;background:var(--sky);color:var(--ink);font:16px/1.7 -apple-system,"Noto Sans SC","PingFang SC",sans-serif;padding:max(20px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom))}
main{max-width:480px;margin:0 auto}h1{font-size:25px;margin:18px 0 6px}h2{font-size:19px;margin:22px 0 6px}p{margin:6px 0}.m{color:var(--mute);font-size:14px}
.bar{height:6px;background:var(--line);border-radius:3px;margin:10px 0 22px}.bar i{display:block;height:100%;background:var(--teal);border-radius:3px}
.q{font-size:21px;margin:14px 0 18px;line-height:1.6}
button,input,select{font:inherit;color:inherit}
.o,.p,.s{display:block;width:100%;margin:10px 0;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);text-align:left}
.p{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600;text-align:center}.s{border-style:dashed;color:var(--mute);text-align:center}
input,select{width:100%;padding:13px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);margin:6px 0 12px}
button:focus-visible,input:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.c{background:var(--card);border-radius:14px;padding:14px 16px;margin:12px 0;border:1px solid var(--line)}
.t{display:inline-block;padding:2px 10px;border-radius:12px;background:var(--sky);border:1px solid var(--line);font-size:13px;margin:3px 4px 3px 0}.w{color:var(--no)}.g{color:var(--teal)}
</style></head><body><main id="app">加载中…</main>
<script>
const P=['v','g','s','r','t','w'],NM={v:'词汇',g:'基础语法',s:'句子理解',r:'阅读理解',t:'翻译',w:'写作'},PERS={v:8,g:8,s:8,r:6,t:4,w:1},LV=['起步','入门','基础','进阶','中级','较高'];
const B={
v:[
[1,'m','book',['书','桌子','笔','门'],'书','常见名词'],
[1,'m','happy',['高兴的','生气的','累的','饿的'],'高兴的','常见形容词'],
[1,'s','写出英文单词：水',0,'water','常见名词'],
[2,'m','borrow',['借入','借出','购买','丢失'],'借入','常见动词'],
[2,'c','I was so ___ that I fell asleep in class.',['tired','tall','tiny','thick'],'tired','形容词辨析'],
[2,'s','写出英文单词：重要的',0,'important','常见形容词'],
[3,'m','benefit',['益处','损失','借口','行为'],'益处','抽象名词'],
[3,'c','Regular exercise can ___ your risk of illness.',['reduce','produce','introduce','increase'],'reduce','动词辨析'],
[3,'s','写出英文单词：环境',0,'environment','抽象名词'],
[4,'m','persuade',['说服','允许','要求','预测'],'说服','常见动词'],
[4,'c','The company plans to ___ its business to Asia.',['expand','explain','explore','express'],'expand','动词辨析'],
[4,'s','写出英文单词：政府',0,'government','抽象名词'],
[5,'m','abandon',['放弃','吸收','获得','接受'],'放弃','考试高频动词'],
[5,'c','He gave a ___ answer, neither agreeing nor refusing.',['vague','vivid','vital','vast'],'vague','形容词辨析'],
[5,'s','写出英文单词：经济',0,'economy','抽象名词']],
g:[
[1,'c','She ___ a student.',['am','is','are','be'],'is','be动词'],
[1,'c','I ___ English every day.',['study','studies','studying','studied'],'study','一般现在时'],
[1,'c','There ___ two books on the desk.',['is','are','am','be'],'are','There be句型'],
[2,'c','He ___ to school yesterday.',['go','goes','went','going'],'went','一般过去时'],
[2,'c','___ you like tea?',['Do','Does','Are','Is'],'Do','一般疑问句'],
[2,'c','They are ___ football now.',['play','plays','playing','played'],'playing','现在进行时'],
[3,'c','I have lived here ___ 2020.',['for','since','in','at'],'since','现在完成时'],
[3,'c','The window ___ by Tom yesterday.',['broke','was broken','is broken','has broken'],'was broken','被动语态'],
[3,'c','She is ___ than her sister.',['tall','taller','tallest','more tall'],'taller','比较级'],
[4,'c','The book ___ I bought yesterday is interesting.',['who','which','where','what'],'which','定语从句'],
[4,'c','He asked me ___ I was doing.',['what','that','which','who'],'what','宾语从句'],
[4,'c','If it rains tomorrow, we ___ at home.',['stay','will stay','stayed','would stay'],'will stay','条件状语从句'],
[5,'c','If I ___ you, I would accept the offer.',['am','was','were','be'],'were','虚拟语气'],
[5,'c','Not only ___ the exam, but he also won a prize.',['he passed','did he pass','passed he','he did pass'],'did he pass','倒装'],
[5,'c','The girl ___ by the teacher is my sister.',['praising','praised','to praise','praise'],'praised','非谓语动词']]};
const $=s=>document.querySelector(s),app=$('#app'),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let db,S={profile:null,sess:null};
const open=()=>new Promise((r,j)=>{const q=indexedDB.open('english-app',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});
const get=k=>new Promise(r=>{try{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()}catch(e){r()}});
const put=(k,v)=>new Promise(r=>{try{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>r(true);t.onerror=()=>r(false)}catch(e){r(false)}});
const save=async()=>{const ok=await put('profile',S.profile)&&await put('sess',S.sess);if(!ok)alert('保存失败：浏览器存储不可用，进度可能丢失。')};
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
function welcome(){app.innerHTML=`<h1>先了解你的英语现状</h1><p class="m">接下来是一次英语水平测评，共 6 部分，约 15 分钟，可以分多次完成。测评期间不显示对错，不会就点“不知道”，不要猜，这样结果才准。</p>
<h2>你的称呼</h2><input id="nm" maxlength="12" placeholder="想让我怎么称呼你">
<h2>MBTI（选填）</h2><input id="mb" maxlength="4" placeholder="例如 INFP，不填也可以">
<h2>每天能学多久</h2><select id="mn"><option>20</option><option selected>30</option><option>45</option><option>60</option></select>
<button class="p" id="go">开始测评</button>`;
$('#go').onclick=async()=>{S.profile={name:$('#nm').value.trim()||'同学',mbti:$('#mb').value.trim().toUpperCase(),minutes:+$('#mn').value,diagnosisCompleted:false,created:Date.now()};
S.sess={part:0,level:2,streak:0,asked:[],done:false};await save();quiz()}}
function pick(){const p=P[S.sess.part],d=B[p],u=S.sess.asked.map(a=>a.i);
for(let k=0;k<5;k++)for(const l of[S.sess.level-k,S.sess.level+k]){if(l<1||l>5)continue;const c=d.map((x,i)=>i).filter(i=>d[i][0]==l&&!u.includes(p+i));if(c.length)return c[Math.floor(Math.random()*c.length)]}return -1}
const here=()=>S.sess.asked.filter(a=>a.p==P[S.sess.part]);
function quiz(){const p=P[S.sess.part],n=here().length;if(n>=PERS[p])return part_end();const i=pick();if(i<0)return part_end();const x=B[p][i];
let h=`<p class="m">${NM[p]} · 第 ${n+1} / ${PERS[p]} 题</p><div class="bar"><i style="width:${n/PERS[p]*100}%"></i></div>`;
if(x[1]=='m')h+=`<p class="m">下面这个单词最接近的意思是？</p><div class="q"><b>${esc(x[2])}</b></div>`;else h+=(x[6]?`<div class="c" style="font-size:16px">${esc(x[6])}</div>`:'')+`<div class="q">${esc(x[2])}</div>`;
if(x[3]){const o=[...x[3]].sort(()=>Math.random()-.5);h+=o.map(t=>`<button class="o" data-v="${esc(t)}">${esc(t)}</button>`).join('')}else h+=`${x[1]=='w'?'<textarea id="ty" rows="6" placeholder="在这里写英文，不会写就点“不知道”" style="width:100%;padding:13px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:inherit;font:inherit"></textarea>':'<input id="ty" autocomplete="off" autocapitalize="none" placeholder="输入你的答案">'}`+`<button class="p" id="ok">提交</button>`;
h+=`<button class="s" id="dk">不知道</button><p class="m">进度已自动保存，可以随时退出，下次继续。</p>`;app.innerHTML=h;
const fin=v=>ans(p,i,v);document.querySelectorAll('.o').forEach(b=>b.onclick=()=>fin(b.dataset.v));$('#dk').onclick=()=>fin(null);
if($('#ok'))$('#ok').onclick=()=>{const v=$('#ty').value.trim();v?fin(v):fin(null)}}
async function ans(p,i,v){const x=B[p][i],idk=v===null;let ok=false,tier=0;if(!idk){if(x[1]=='t'){ok=x[4].filter(k=>k.some(w=>v.toLowerCase().includes(w))).length/x[4].length>=.6}else if(x[1]=='w'){const wc=(v.match(/[A-Za-z']+/g)||[]).length,sn=(v.match(/[.!?]/g)||[]).length;tier=wc<5?1:(wc<15||sn<2)?2:3;if(!/^[A-Z]/.test(v.trim())&&tier>1)tier--;ok=tier>=2}else ok=v.toLowerCase()==x[4].toLowerCase()}
S.sess.asked.push({p,i:p+i,l:x[0],t:x[1],k:x[5],ok,idk,tier});
if(ok){S.sess.streak++;if(S.sess.streak>=2){S.sess.level=Math.min(5,S.sess.level+1);S.sess.streak=0}}else{S.sess.level=Math.max(1,S.sess.level-1);S.sess.streak=0}
await save();quiz()}
function part_end(){const last=S.sess.part>=P.length-1;if(last){S.sess.done=true;S.profile.diagnosisCompleted=true;S.profile.plan=mkplan();save().then(report);return}
app.innerHTML=`<h1>${NM[P[S.sess.part]]}部分完成</h1><p class="m">下一部分：${NM[P[S.sess.part+1]]}。现在休息一下也可以，进度已保存。</p><button class="p" id="nx">继续</button>`;
$('#nx').onclick=async()=>{S.sess.part++;S.sess.level=2;S.sess.streak=0;await save();quiz()}}
function est(a){let b=0;for(let l=1;l<=5;l++){const r=a.filter(x=>x.l==l);if(r.length&&r.filter(x=>x.ok).length/r.length>=.5)b=l}return b}
function report(){const pf=S.profile;let h=`<h1>${esc(pf.name)}，的英语能力画像</h1><p class="m">6 项测评已全部完成。每部分题量少，结果都是“暂定”，之后会用学习中的表现不断修正。</p>`;
const tags={g:[],w:[]};
for(const p of P){const a=S.sess.asked.filter(x=>x.p==p),e=lv(p);h+=`<div class="c"><b>${NM[p]}</b>：${LV[e]}（暂定）<p class="m">共 ${a.length} 题，答对 ${a.filter(x=>x.ok).length}，选“不知道” ${a.filter(x=>x.idk).length}。题量少，结果仅供参考。</p>`;
if(p=='v'){const T={m:'认出',c:'理解',s:'会用'};h+=['m','c','s'].map(t=>{const r=a.filter(x=>x.t==t);return r.length?`<span class="t">${T[t]}：${r.filter(x=>x.ok).length}/${r.length}</span>`:''}).join('')}h+='</div>';
a.forEach(x=>(x.ok?tags.g:tags.w).push(x.k+(x.idk?'（不会）':'')))}
const u=a=>[...new Set(a)];
h+=`<h2>目前看起来</h2><p><b class="g">答对的知识点：</b>${u(tags.g).map(t=>`<span class="t">${esc(t)}</span>`).join('')||'暂无'}</p><p><b class="w">还没掌握或不稳定：</b>${u(tags.w).map(t=>`<span class="t">${esc(t)}</span>`).join('')||'暂无'}</p>
<p class="m">每个知识点只测了 1 题，不能说明真的掌握，之后会用练习继续验证。</p>
${planHTML()}<p class="m">翻译按关键词粗判、写作按字数和句数粗判，都不是严格批改，接入 AI 后会更准。</p>
<button class="s" id="ex">导出我的数据备份</button><button class="s" id="rs">删除我的全部数据并重新测评</button>`;app.innerHTML=h;
$('#ex').onclick=()=>{const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='english-backup.json';a.click()};
$('#rs').onclick=async()=>{if(confirm('确定删除吗？删除后无法恢复。')){await put('profile',null);await put('sess',null);S={profile:null,sess:null};welcome()}}}

B.s=[
[1,'c','“My name is Tom.” 的意思是？',['我的名字是汤姆','汤姆是我的老师','我认识汤姆','我喜欢汤姆'],'我的名字是汤姆','基础句意'],
[1,'c','“She reads a book.” 中，主语是哪个词？',['She','reads','a','book'],'She','主语'],
[2,'c','哪一句是正确的？',["He don't like milk.","He doesn't like milk.","He not like milk.","He doesn't likes milk."],"He doesn't like milk.",'否定句'],
[2,'c','“I eat an apple.” 中，宾语是？',['I','eat','an apple','apple eat'],'an apple','宾语'],
[3,'c','“She is always late for class.” 的意思是？',['她上课总是迟到','她总是早到','她从不上课','她喜欢上课'],'她上课总是迟到','句子整体含义'],
[3,'c','“The boy looks happy.” 中 looks 是什么用法？',['系动词，连接主语和表语','表示“看”的动作','助动词','情态动词'],'系动词，连接主语和表语','主系表'],
[4,'c','“The man who is standing there is my uncle.” 中 who is standing there 修饰谁？',['the man','uncle','there','standing'],'the man','定语从句'],
[4,'c','“It is said that he has left.” 的意思是？',['据说他已经离开了','他说他要离开','有人说他在这儿','他被人说走了'],'据说他已经离开了','长句理解'],
[5,'c','“Had I known, I would have told you.” 的意思是？',['要是我早知道，我就告诉你了','我知道，所以告诉了你','我曾经告诉过你','如果我知道，我就会告诉你（现在）'],'要是我早知道，我就告诉你了','倒装与虚拟'],
[5,'c','“What he said made me think twice.” 中的主语是？',['What he said','he','me','think twice'],'What he said','主语从句']];
const T1='Tom has a dog. Its name is Max. Every morning, Tom takes Max to the park. They play there for an hour.',T2='Many people think reading is boring. But Lisa, a high school student, reads for twenty minutes every night. She says it helps her relax and learn new words. Now she reads three books a month.',T3='Although online shopping saves time, it may lead people to buy things they do not need. Experts suggest making a list before shopping and waiting a day before paying, so that we can tell the difference between what we want and what we need.';
B.r=[
[1,'c','What is the dog’s name?',['Max','Tom','Park','Hour'],'Max','找关键信息',T1],
[2,'c','When does Tom take the dog to the park?',['In the morning','At night','In the afternoon','After school'],'In the morning','细节理解',T1],
[3,'c','Why does Lisa read every night?',['It helps her relax and learn words','Her teacher asks her to','She has no other hobby','She wants to win a prize'],'It helps her relax and learn words','理解上下文',T2],
[3,'c','What can we infer about Lisa?',['She has made reading a habit','She dislikes books','She reads only on weekends','She has finished school'],'She has made reading a habit','推断',T2],
[4,'c','What do experts suggest?',['Make a list and wait a day before paying','Never shop online','Buy more things at once','Pay quickly to save time'],'Make a list and wait a day before paying','细节理解',T3],
[5,'c','What is the main idea of the passage?',['Online shopping needs careful control','Online shopping is cheaper','Experts dislike shopping','Lists are hard to make'],'Online shopping needs careful control','主旨与逻辑',T3]];
B.t=[
[1,'t','把这句话翻译成中文：I like apples.',0,[['我'],['喜欢'],['苹果']],'英译中'],
[2,'t','把这句话翻译成英文：她每天早上跑步。',0,[['she'],['run','jog'],['morning'],['every']],'中译英'],
[3,'t','把这句话翻译成中文：If it rains tomorrow, we will stay at home.',0,[['如果','假如','要是'],['下雨'],['明天'],['在家','待在家','留在家','呆在家']],'英译中（条件句）'],
[4,'t','把这句话翻译成英文：我们必须保护环境。',0,[['we'],['must','should','have to','need'],['protect','save'],['environment']],'中译英']];
B.w=[[1,'w','用英文写 2 到 3 句话介绍你自己，比如名字、身份、爱好。写不出来可以点“不知道”。',0,null,'写作']];
function lv(p){const a=S.sess.asked.filter(x=>x.p==p);return p=='w'?(a[0]?a[0].tier:0):est(a)}
function mkplan(){const L={};P.forEach(p=>L[p]=lv(p));const m=S.profile.minutes,g=L.g,v=L.v;
const start=g<=1?'句子基础：词类、主谓宾、be动词':g==2?'动词基础：一般现在时、一般过去时、疑问句与否定句':g==3?'时态进阶：完成时、被动语态、比较级':'复杂句型：各类从句、非谓语动词、虚拟语气';
let f=[.17,.27,.33,.17,.06];if(g<=2){f[2]+=.07;f[1]-=.07}if(v<=2){f[0]+=.05;f[3]-=.05}
const n=['旧词复习','新词学习','语法教学','互动练习','今日总结'],mm=f.map(x=>Math.round(x*m));mm[4]+=m-mm.reduce((a,b)=>a+b,0);
const why=[`语法暂定“${LV[g]}”，所以从最靠前的未掌握点开始，不跳级。`,v<=2?'词汇暂定偏弱，增加旧词复习，新词量保守。':'词汇暂定不弱，保持常规新词量。',g<=2?'语法薄弱，语法教学时间增加。':'语法有一定基础，练习时间保持。'];
const other=(L.r<=2?'阅读：前 2 周只做句子精读，第 3 周起加入短文。':'阅读：第 1 周起每周 2 篇短文。')+(L.t<=2?'翻译和写作：先从简单句开始，不直接写作文。':'翻译和写作：第 2 周起加入段落练习。');
return{start,why,min:m,split:mm.map((x,i)=>[n[i],x]),nw:v<=1?6:v<=2?8:v<=3?12:15,other,L,created:Date.now()}}
function planHTML(){const p=S.profile.plan;if(!p)return'';return `<h2>第一阶段学习方案（初版）</h2><div class="c"><b>起点：</b>${esc(p.start)}<p class="m">${p.why.map(esc).join('<br>')}</p></div><div class="c"><b>每天 ${p.min} 分钟</b><p>${p.split.map(x=>`<span class="t">${x[0]} ${x[1]} 分钟</span>`).join('')}</p><p class="m">新词每天 ${p.nw} 个，旧词复习优先。</p></div><div class="c"><b>阅读、翻译、写作</b><p class="m">${esc(p.other)}</p></div><p class="m">这是初版，会按你的实际表现调整，建议第 2 周末做一次阶段检测。</p>`}
function notice(){app.innerHTML=`<h1>新增 4 项测评已开放</h1><p class="m">句子理解、阅读、翻译、写作，大约 8 分钟。做完就能生成你的学习方案。</p><button class="p" id="nx">继续测评</button>`;$('#nx').onclick=quiz}
(async()=>{try{db=await open()}catch(e){app.innerHTML='<h1>无法使用本地存储</h1><p>你的浏览器禁用了存储功能，进度无法保存。请换用 Chrome 并关闭无痕模式。</p>';return}
S.profile=await get('profile')||null;S.sess=await get('sess')||null;
if(!S.profile||!S.sess)return welcome();if(S.sess.done&&S.sess.part<P.length-1){S.sess.done=false;S.sess.part++;S.sess.level=2;S.sess.streak=0;await save();return notice()}if(S.sess.done)return report();quiz()})();
</script></body></html>
