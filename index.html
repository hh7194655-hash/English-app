$('#go').onclick=async()=>{S.profile={name:$('#nm').value.trim()||'同学',mbti:$('#mb').value.trim().toUpperCase(),minutes:+$('#mn').value,diagnosisCompleted:false,created:Date.now()};
S.sess={part:0,level:2,streak:0,asked:[],done:false};await save();quiz()}}
function pick(){const p=P[S.sess.part],d=B[p],u=S.sess.asked.map(a=>a.i);
for(let k=0;k<5;k++)for(const l of[S.sess.level-k,S.sess.level+k]){if(l<1||l>5)continue;const c=d.map((x,i)=>i).filter(i=>d[i][0]==l&&!u.includes(p+i));if(c.length)return c[Math.floor(Math.random()*c.length)]}return -1}
const here=()=>S.sess.asked.filter(a=>a.p==P[S.sess.part]);
function quiz(){const p=P[S.sess.part],n=here().length;CP=p;if(n>=PERS[p])return part_end();const i=pick();if(i<0)return part_end();const x=B[p][i];
let h=`<div class="nv"><button class="g2" id="pv" ${S.sess.asked.length?'':'disabled'}>‹ 上一题</button><button class="g2" id="ct">答题卡</button>${p=='v'?'':'<button class="g2" id="lk">查词</button>'}</div><p class="m">${NM[p]} · 第 ${n+1} / ${PERS[p]} 题</p><div class="bar"><i style="width:${n/PERS[p]*100}%"></i></div>`;
if(x[1]=='m')h+=`<p class="m">下面这个单词最接近的意思是？</p><div class="q"><b>${esc(x[2])}</b></div>`;else h+=(x[6]?`<div class="c" style="font-size:16px">${W(x[6])}</div>`:'')+`<div class="q">${W(x[2])}</div>`;
if(x[3]){const o=[...x[3]].sort(()=>Math.random()-.5);h+=o.map(t=>`<button class="o" data-v="${esc(t)}">${esc(t)}</button>`).join('')}else h+=`${x[1]=='w'?'<textarea id="ty" rows="6" placeholder="在这里写英文，不会写就点“不知道”" style="width:100%;padding:13px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:inherit;font:inherit"></textarea>':'<input id="ty" autocomplete="off" autocapitalize="none" placeholder="输入你的答案">'}`+`<button class="p" id="ok">提交</button>`;
h+=`<button class="s" id="dk">不知道</button><p class="m">进度已自动保存，可以随时退出，下次继续。</p>`;app.innerHTML=h;
$('#pv').onclick=()=>review(S.sess.asked.length-1,quiz);$('#ct').onclick=()=>cardScreen(quiz);if($('#lk'))$('#lk').onclick=()=>sheet();const fin=v=>ans(p,i,v);document.querySelectorAll('.o').forEach(b=>b.onclick=()=>fin(b.dataset.v));$('#dk').onclick=()=>fin(null);
if($('#ok'))$('#ok').onclick=()=>{const v=$('#ty').value.trim();v?fin(v):fin(null)}}
async function ans(p,i,v){const x=B[p][i],idk=v===null;let ok=false,tier=0;if(!idk){if(x[1]=='t'){ok=x[4].filter(k=>k.some(w=>v.toLowerCase().includes(w))).length/x[4].length>=.75}else if(x[1]=='w'){const wc=(v.match(/[A-Za-z']+/g)||[]).length,sn=(v.match(/[.!?]/g)||[]).length;tier=wc<5?1:(wc<15||sn<2)?2:3;if(!/^[A-Z]/.test(v.trim())&&tier>1)tier--;ok=tier>=2}else ok=v.toLowerCase()==x[4].toLowerCase()}
S.sess.asked.push({p,i:p+i,l:x[0],t:x[1],k:x[5],ok,idk,tier,a:v});
if(ok){S.sess.streak++;if(S.sess.streak>=2){S.sess.level=Math.min(5,S.sess.level+1);S.sess.streak=0}}else{S.sess.level=Math.max(1,S.sess.level-1);S.sess.streak=0}
await save();quiz()}
function part_end(){const last=S.sess.part>=P.length-1;if(last){S.sess.done=true;S.profile.diagnosisCompleted=true;S.profile.plan=mkplan();save().then(report);return}
app.innerHTML=`<h1>${NM[P[S.sess.part]]}部分完成</h1><p class="m">下一部分：${NM[P[S.sess.part+1]]}。现在休息一下也可以，进度已保存。</p><button class="p" id="nx">继续</button>`;
$('#nx').onclick=async()=>{S.sess.part++;S.sess.level=2;S.sess.streak=0;await save();quiz()}}
function est(a){let b=0;for(let l=1;l<=5;l++){const r=a.filter(x=>x.l==l);if(r.length&&r.filter(x=>x.ok).length/r.length>=.5)b=l}return b}

const tags={g:[],w:[]};
for(const p of P){const a=S.sess.asked.filter(x=>x.p==p),e=lv(p);h+=`<div class="c"><b>${NM[p]}</b>：${LV[e]}（暂定）<p class="m">共 ${a.length} 题，答对 ${a.filter(x=>x.ok).length}，选“不知道” ${a.filter(x=>x.idk).length}。题量少，结果仅供参考。</p>`;
if(p=='v'){const T={m:'认出',c:'理解',s:'会用'};h+=['m','c','s'].map(t=>{const r=a.filter(x=>x.t==t);return r.length?`<span class="t">${T[t]}：${r.filter(x=>x.ok).length}/${r.length}</span>`:''}).join('')}h+='</div>';
a.forEach(x=>(x.ok?tags.g:tags.w).push(x.k+(x.idk?'（不会）':'')))}
const u=a=>[...new Set(a)];
h+=`<h2>目前看起来</h2><p><b class="g">答对的知识点：</b>${u(tags.g).map(t=>`<span class="t">${esc(t)}</span>`).join('')||'暂无'}</p><p><b class="w">还没掌握或不稳定：</b>${u(tags.w).map(t=>`<span class="t">${esc(t)}</span>`).join('')||'暂无'}</p>
<p class="m">每个知识点只测了 1 题，不能说明真的掌握，之后会用练习继续验证。</p>
${planHTML()}<p class="m">翻译按关键词粗判、写作按字数和句数粗判，都不是严格批改，接入 AI 后会更准。</p>
<button class="p" id="hm">回到首页</button><button class="s" id="ct">答题卡</button><button class="s" id="rv">回看我的全部答案</button><button class="s" id="ex">导出我的数据备份</button><button class="s" id="rs">删除我的全部数据并重新测评</button>`;app.innerHTML=h;
$('#hm').onclick=home;$('#ct').onclick=()=>cardScreen(report);$('#rv').onclick=()=>review(0,report);$('#ex').onclick=()=>{const b=new Blob([JSON.stringify({...S,words:WD},null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='english-backup.json';a.click()};
$('#rs').onclick=async()=>{if(confirm('确定删除吗？删除后无法恢复。')){await put('profile',null);await put('sess',null);await put('words',null);WD={m:{},fav:[],day:{d:'',n:0}};S={profile:null,sess:null};welcome()}}}

B.s=[
[1,'c','“My name is Tom.” 的意思是？',['我的名字是汤姆','汤姆是我的老师','我认识汤姆','我喜欢汤姆'],'我的名字是汤姆','基础句意'],
[1,'c','“She reads a book.” 中，主语是哪个词？',['She','reads','a','book'],'She','主语'],

[3,'c','“The boy looks happy.” 中 looks 是什么用法？',['系动词，连接主语和表语','表示“看”的动作','助动词','情态动词'],'系动词，连接主语和表语','主系表'],
[4,'c','“The man who is standing there is my uncle.” 中 who is standing there 修饰谁？',['the man','uncle','there','standing'],'the man','定语从句'],

[5,'c','“Had I known, I would have told you.” 的意思是？',['要是我早知道，我就告诉你了','我知道，所以告诉了你','我曾经告诉过你','如果我知道，我就会告诉你（现在）'],'要是我早知道，我就告诉你了','倒装与虚拟'],

function lv(p){const a=S.sess.asked.filter(x=>x.p==p);return p=='w'?(a[0]?a[0].tier:0):est(a)}
function mkplan(){const L={};P.forEach(p=>L[p]=lv(p));const m=S.profile.minutes,g=L.g,v=L.v;
const start=g<=1?'句子基础：词类、主谓宾、be动词':g==2?'动词基础：一般现在时、一般过去时、疑问句与否定句':g==3?'时态进阶：完成时、被动语态、比较级':'复杂句型：各类从句、非谓语动词、虚拟语气';
let f=[.17,.27,.33,.17,.06];if(g<=2){f[2]+=.07;f[1]-=.07}if(v<=2){f[0]+=.05;f[3]-=.05}
const n=['旧词复习','新词学习','语法教学','互动练习','今日总结'],mm=f.map(x=>Math.round(x*m));mm[4]+=m-mm.reduce((a,b)=>a+b,0);
const why=[`语法暂定“${LV[g]}”，所以从最靠前的未掌握点开始，不跳级。`,v<=2?'词汇暂定偏弱，增加旧词复习，新词量保守。':'词汇暂定不弱，保持常规新词量。',g<=2?'语法薄弱，语法教学时间增加。':'语法有一定基础，练习时间保持。'];

const TRI=()=>(WD.tr=WD.tr||{}),RDI=()=>(WD.rd=WD.rd||{}),WRI=()=>(WD.wr=WD.wr||{});
function trRec(){return`阅读 ${Object.keys(RDI()).length}/${RD.length} · 翻译 ${Object.keys(TRI()).length}/${TR.length} · 写作 ${Object.keys(WRI()).length}/${WR.length}`}
function trHome(){clearInterval(window.TI);app.innerHTML=`<div class="nv"><button class="g2" id="bk">‹ 返回</button></div><h1>阅读、翻译、写作</h1><p class="m">从简单到难。翻译和写作目前是规则粗判，并对照参考答案，不是严格批改，接入 AI 后会更准。</p><button class="o" id="a"><b>阅读训练</b><br><span class="m">短文、逐句精读、查词、计时</span></button><button class="o" id="b"><b>翻译训练</b><br><span class="m">英译中、中译英，对照参考译文</span></button><button class="o" id="c"><b>写作训练</b><br><span class="m">从几句话到 80 词短文</span></button>`;$('#bk').onclick=home;$('#a').onclick=rHome;$('#b').onclick=tHome;$('#c').onclick=wHome}
function qrun(items,n,sc,tag,done){if(n>=items.length)return done(sc);const q=items[n][0],o=items[n][1],a=items[n][2],r=items[n][3];

function rHome(){clearInterval(window.TI);const d=RDI();app.innerHTML=`<div class="nv"><button class="g2" id="bk">‹ 返回</button></div><h1>阅读训练</h1>`+RD.map((p,i)=>`<button class="o" data-i="${i}"><b>${esc(p.t)}</b> <span class="t">${p.lv}</span> <span class="t">${d[p.id]?'已读 '+d[p.id].sc+'/'+p.q.length:'未读'}</span></button>`).join('')+'<p class="m">更多文章会陆续增加。</p>';

window.TI=setInterval(()=>{const e=$('#tm');if(e)e.textContent='用时 '+Math.round((Date.now()-t0)/1000)+' 秒'},1000);
$('#bk').onclick=rHome;$('#in').onclick=()=>rint(i,0,()=>rread(i));$('#go').onclick=()=>{const sec=Math.round((Date.now()-t0)/1000);clearInterval(window.TI);qrun(p.q,0,0,'阅读·'+p.t,sc=>{const r=RDI()[p.id]={sc,secs:sec,t:Date.now()};sv();
app.innerHTML=`<h1>读完了</h1><p>答对 ${sc} / ${p.q.length} 题，阅读用时 ${sec} 秒。</p><p class="m">只做一篇不能说明阅读能力，多读几篇再看趋势。答错的题已记进错题记录。</p><button class="p" id="a">逐句精读这篇文章</button><button class="s" id="b">回到文章列表</button>`;$('#a').onclick=()=>rint(i,0,rHome);$('#b').onclick=rHome})}}
function rint(i,k,back){const p=RD[i],x=p.s[k];CP='r';
app.innerHTML=`<p class="m">逐句精读 · ${p.t} · ${k+1} / ${p.s.length}</p><div class="bar"><i style="width:${(k+1)/p.s.length*100}%"></i></div><div class="c" style="font-size:19px;line-height:1.8">${W(x[0])}</div><div id="zh"></div><button class="s" id="sz">显示中文翻译</button><button class="s" id="sn2">显示结构与语法点</button><div class="nv"><button class="g2" id="pv" ${k?'':'disabled'}>‹ 上一句</button><button class="g2" id="xt">${k==p.s.length-1?'完成':'下一句 ›'}</button></div>`;
$('#sz').onclick=()=>{$('#zh').innerHTML+=`<div class="c"><b>中文</b><p>${esc(x[1])}</p></div>`};$('#sn2').onclick=()=>{$('#zh').innerHTML+=`<div class="c"><b>结构与语法</b><p>${esc(x[2])}</p></div>`};$('#pv').onclick=()=>rint(i,k-1,back);$('#xt').onclick=()=>k==p.s.length-1?back():rint(i,k+1,back)}
function tHome(){const d=TRI();app.innerHTML=`<div class="nv"><button class="g2" id="bk">‹ 返回</button></div><h1>翻译训练</h1>`+TR.map((x,i)=>`<button class="o" data-i="${i}"><span class="t">${x[0]=='en'?'英译中':'中译英'}</span> ${esc(x[1])}${d[i]?' <span class="t">已做</span>':''}</button>`).join('');
$('#bk').onclick=trHome;document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>tdo(+b.dataset.i))}
function tdo(i,pre){const x=TR[i];CP='t';app.innerHTML=`<div class="nv"><button class="g2" id="bk">‹ 题目列表</button></div><p class="m">${x[0]=='en'?'把下面的句子翻译成中文':'把下面的句子翻译成英文'}</p><div class="q">${x[0]=='en'?W(x[1]):esc(x[1])}</div><textarea id="ty" rows="4" placeholder="写下你的翻译，不会就点“不知道”" style="width:100%;padding:13px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:inherit;font:inherit">${esc(pre||'')}</textarea><button class="p" id="ok">提交</button><button class="s" id="dk">不知道</button>`;
$('#bk').onclick=tHome;const fin=v0=>{const v=v0?v0.replace(/[’‘]/g,"'"):null,good=[],bad=[],tips=[];let mp=0,mt=0,bv=0;
if(v){const zh=/[\u4e00-\u9fa5]/.test(v),la=/[A-Za-z]/.test(v);if(x[0]=='en'&&!zh)bad.push('这题要翻译成中文，请用中文作答。');else if(x[0]=='zh'&&!la)bad.push('这题要翻译成英文，请用英文作答。');
else{x[3].forEach(r=>{const hit=r[1].test(v);if(r[0]=='m'){mt++;if(hit){mp++;if(r[3])good.push(r[3])}else bad.push(r[2])}else if(hit){bv++;bad.push(r[2])}});
if(x[0]=='zh'){if(!/^[A-Z]/.test(v.trim()))tips.push('英文句子第一个字母要大写。');if(!/[.!?]$/.test(v.trim()))tips.push('句末要加标点。')}}}
const full=!!v&&mt>0&&mp==mt&&!bv,near=!!v&&mt>0&&!full&&mp/mt>=.75&&bv<=1;sfx(full);
TRI()[i]={mp,mt,bv,full,t:Date.now()};if(!full){const M=WD.mis=WD.mis||[];M.push({l:'翻译',q:x[1],my:v0||'（不知道）',ans:x[2],why:v?bad.join(' '):'选择了不知道',t:Date.now()});if(M.length>300)M.shift()}sv();
const L=a=>a.map(t=>`<p>${esc(t)}</p>`).join('');
app.innerHTML=`<div class="c"><b class="${full?'g':'w'}">${!v?'没关系，先看参考译文':full?'✓ 要点齐全，译得对':near?'△ 接近了，但还有问题要改':'✗ 还需要修改'}</b><p class="m">你的译文</p><p>${esc(v0||'（空）')}</p><p class="m">参考译文（不是唯一答案）</p><p>${esc(x[2])}</p>${good.length?`<p class="g"><b>做对的地方</b></p>${L(good)}`:''}${bad.length?`<p class="w"><b>需要修改的地方</b></p>${L(bad)}`:''}${tips.length?`<p class="m">小提醒：${esc(tips.join(''))}</p>`:''}<p class="m">提示：${esc(x[4])}</p><p class="m">这是针对本题关键点的规则分析，不是完整批改。</p></div>${v&&!full?'<button class="s" id="rt">按提示改一改再试</button>':''}<button class="p" id="nx">${i<TR.length-1?'下一题':'回到列表'}</button>`;
if($('#rt'))$('#rt').onclick=()=>tdo(i,v0);$('#nx').onclick=()=>i<TR.length-1?tdo(i+1):tHome()};
$('#ok').onclick=()=>fin($('#ty').value.trim()||null);$('#dk').onclick=()=>fin(null)}
function wHome(){const d=WRI();app.innerHTML=`<div class="nv"><button class="g2" id="bk">‹ 返回</button></div><h1>写作训练</h1>`+WR.map((x,i)=>`<button class="o" data-i="${i}"><b>${esc(x.t)}</b> <span class="t">至少 ${x.min} 词</span>${d[x.id]?' <span class="t">写过</span>':''}</button>`).join('');

function wdo(i,txt){const x=WR[i];app.innerHTML=`<div class="nv"><button class="g2" id="bk">‹ 题目列表</button></div><h1>${esc(x.t)}</h1><div class="c"><b>要求</b><p>用英文写，至少 ${x.min} 词。</p><p class="m">${esc(x.tip)}</p></div><textarea id="ty" rows="9" placeholder="在这里写" style="width:100%;padding:13px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:inherit;font:inherit">${esc(txt!==undefined?txt:(WRI()[x.id]||{}).text||'')}</textarea><p class="m" id="cn">0 词</p><button class="p" id="ok">检查</button>`;
const cn=()=>{$('#cn').textContent=(($('#ty').value.match(/[A-Za-z']+/g)||[]).length)+' 词'};$('#ty').oninput=cn;cn();$('#bk').onclick=wHome;
$('#ok').onclick=()=>{const t=$('#ty').value.trim(),wc=(t.match(/[A-Za-z']+/g)||[]).length,sn=(t.match(/[.!?]/g)||[]).length,cons=['first','then','because','however','therefore','for example','in conclusion','also','but','so','after','finally'].filter(c=>new RegExp('\\b'+c+'\\b','i').test(t)),low=t.split(/[.!?]\s*/).filter(z=>/^[a-z]/.test(z.trim())).length,adv=[];
if(!wc)adv.push('还没写内容，先试着写一句也可以。');else{if(wc<x.min)adv.push(`还差 ${x.min-wc} 个词才够 ${x.min} 词。`);else adv.push('字数够了。');if(sn<3&&x.min>=60)adv.push('句子偏少，试着把内容拆成更多完整的句子。');if(!cons.length&&x.min>=60)adv.push('可以加 2 个连接词，比如 because、however、for example。');else if(cons.length)adv.push('用到的连接词：'+cons.join('、')+'。');if(low)adv.push(`有 ${low} 句开头没有大写。`);if(/\bi\b/.test(t))adv.push('单独的 I 要大写。');if(!/[.!?]$/.test(t))adv.push('结尾没有标点。')}
WRI()[x.id]={text:t,words:wc,t:Date.now()};sv();
